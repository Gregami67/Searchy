services:
  valkey:
    image: valkey/valkey-bundle:9.1.2-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data
    environment:
      - VALKEY_EXTRA_FLAGS=--save 60 1 --loglevel warning

  searchy:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - IMAGE_DIR=/app/images
    ports:
      - 8000:8000
    volumes:
      - ${IMAGE_DIR}:/app/images:ro
    depends_on:
      - valkey

volumes:
  valkey_data:
