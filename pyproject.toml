[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "searchy"
dynamic = ["version"]
dependencies = [
  "Flask==3.1.3",
  "python-dotenv==1.2.2",
  "torchvision==0.28.0",
  "transformers==5.14.1",
  "valkey==6.1.1",
  "watchdog==6.0.0",
]

requires-python = ">=3.12"

authors = [
  {name = "Gregami", email = "git@gregami.com"},
]
maintainers = [
  {name = "Gregami", email = "git@gregami.com"},
]

description = "Search images and more from context"
readme = "README.md"
license = "MIT"
keywords = ["context search", "CLIP"]
