[build-system]
requires = ["setuptools >= 80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "searchy"
version = "1.0.1"
requires-python = ">=3.12"

authors = [{ name = "Gregami", email = "git@gregami.com" }]
maintainers = [{ name = "Gregami", email = "git@gregami.com" }]

description = "Search images and more from context"
readme = "README.md"
license = "MIT"
keywords = ["context search", "CLIP"]

dependencies = [
  "Flask==3.1.3",
  "gunicorn==26.0.0",
  "python-dotenv==1.2.2",
  "torch==2.13.0",
  "torchvision==0.28.0",
  "transformers==5.14.1",
  "valkey==6.1.1",
  "watchdog==6.0.0",
]

[project.scripts]
searchy-dev = "wsgi:run_dev"
searchy-prod = "wsgi:run_prod"
