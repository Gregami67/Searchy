<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; min-height: 100vh; }
        .search-container { display: flex; justify-content: center; padding: 60px 20px 40px; }
        .search-form { display: flex; gap: 8px; width: 100%; max-width: 500px; }
        .search-input { flex: 1; padding: 12px 16px; border: none; border-radius: 8px; font-size: 16px; background: #2a2a2a; color: #e0e0e0; outline: none; }
        .search-input:focus { box-shadow: 0 0 0 2px #4a9eff; }
        .search-input::placeholder { color: #666; }
        .search-btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; background: #4a9eff; color: white; cursor: pointer; transition: background 0.2s; }
        .search-btn:hover { background: #3a8eef; }
        .search-btn:disabled { opacity: 0.5; cursor: wait; }
        .gallery { padding: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px; max-width: 1400px; margin: 0 auto; }
        .gallery-item { border-radius: 8px; overflow: hidden; background: #2a2a2a; transition: transform 0.2s; display: flex; justify-content: center; align-items: center; }
        .gallery-item:hover { transform: scale(1.03); }
        .gallery-item img { width: 100%; height: auto; display: block; object-fit: contain; }
        #loader { text-align: center; padding: 40px; color: #666; font-size: 14px; }
        .pagination { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 40px 20px; max-width: 1400px; margin: 0 auto; }
        .page-btn { padding: 8px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; transition: all 0.2s; background: #2a2a2a; color: #e0e0e0; text-decoration: none; }
        .page-btn:hover:not(:disabled) { background: #3a3a3a; }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .page-info { color: #888; font-size: 14px; }
        #results { display: none; }
    </style>
</head>
<body>
    <div class="search-container">
        <form class="search-form" id="searchForm">
            <input type="text" name="q" id="searchInput" class="search-input" placeholder="Describe what you're looking for..." autofocus>
            <button type="submit" class="search-btn" id="searchBtn">Search</button>
        </form>
    </div>

    <div id="results"></div>
    <div id="loader" style="display:none;">Loading...</div>

    <script>
        const resultsEl = document.getElementById('results');
        const loader = document.getElementById('loader');
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        let currentQuery = '';
        let currentPage = 1;
        let hasMore = false;
        let isLoading = false;

        function showEmptyMessage(query) {
            resultsEl.style.display = 'block';
            resultsEl.innerHTML = '<p style="text-align:center; padding:40px; color:#666;">No results found for "' + query + '"</p>';
            hasMore = false;
        }

        function appendGallery(results) {
            resultsEl.style.display = 'block';
            if (results.image_paths.length === 0) {
                hasMore = false;
                return;
            }

            let html = '';
            for (const name of results.image_paths) {
                html += '<div class="gallery-item">'
                    + '<img src="/images/' + encodeURIComponent(name) + '" alt="' + name + '">'
                    + '</div>';
            }

            if (!resultsEl.querySelector('.gallery')) {
                resultsEl.innerHTML = '<div class="gallery"></div>';
            }
            const gallery = resultsEl.querySelector('.gallery');
            gallery.insertAdjacentHTML('beforeend', html);
            hasMore = results.has_next;
        }

        async function doSearch(query, page) {
            input.value = query;
            currentQuery = query;
            currentPage = page;

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = 'Searching...';

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({q: query, page: page})
                });
                const data = await res.json();
                if (page === 1) {
                    hasMore = data.has_next;
                    if (!hasMore && data.total <= 0) {
                        showEmptyMessage(data.search_query || query);
                    }
                    appendGallery(data);
                } else {
                    hasMore = false;
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search';
            }
        }

        function showEmptyMessage(query) {
            resultsEl.style.display = 'block';
            resultsEl.innerHTML = '<p style="text-align:center; padding:40px; color:#666;">No results found for "' + query + '"</p>';
            hasMore = false;
        }

        async function loadMore() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            loader.style.display = 'block';

            currentPage++;
            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({q: currentQuery, page: currentPage})
                });
                const data = await res.json();
                appendGallery(data);
            } finally {
                isLoading = false;
                if (!hasMore) loader.style.display = 'none';
            }
        }

        // Infinite scroll using IntersectionObserver
        let sentinel = document.createElement('div');
        sentinel.id = 'scroll-sentinel';
        sentinel.style.height = '1px';
        document.body.appendChild(sentinel);

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && hasMore) {
                loadMore();
            }
        }, { rootMargin: '400px' });
        observer.observe(sentinel);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = input.value.trim();
            if (!q) return;
            currentPage = 1;
            hasMore = true;
            resultsEl.innerHTML = '<div class="gallery"></div>';
            doSearch(q, 1);
        });

        let debounceTimer;
        input.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const q = input.value.trim();
            if (!q) return;
            debounceTimer = setTimeout(() => {
                currentPage = 1;
                hasMore = true;
                resultsEl.innerHTML = '<div class="gallery"></div>';
                doSearch(q, 1);
            }, 500);
        });
    </script>
</body>
</html>
