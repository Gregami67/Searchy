<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; min-height: 100vh; }
        .search-container { display: flex; justify-content: center; padding: 60px 20px 40px; }
        .search-form { display: flex; gap: 8px; width: 100%; max-width: 500px; }
        .search-input { flex: 1; padding: 12px 16px; border: none; border-radius: 8px; font-size: 16px; background: #2a2a2a; color: #e0e0e0; outline: none; }
        .search-input:focus { box-shadow: 0 0 0 2px #4a9eff; }
        .search-input::placeholder { color: #666; }
        .search-btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; background: #4a9eff; color: white; cursor: pointer; transition: background 0.2s; }
        .search-btn:hover { background: #3a8eef; }
        gallery { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; max-width: 1400px; margin: 0 auto; }
        .gallery-item { border-radius: 8px; overflow: hidden; background: #2a2a2a; transition: transform 0.2s; }
        .gallery-item:hover { transform: scale(1.03); }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; display: block; }
        .gallery-item .caption { padding: 8px 12px; font-size: 13px; color: #999; word-break: break-all; }
    </style>
</head>
<body>
    {% if search_query %}
    <div class="search-container">
        <form method="GET" class="search-form" action="/">
            <input type="text" name="q" class="search-input" placeholder="Describe what you're looking for..." value="{{ search_query }}">
            <button type="submit" class="search-btn">Search</button>
        </form>
    </div>
    {% else %}
    <div class="search-container">
        <form method="GET" class="search-form" action="/">
            <input type="text" name="q" class="search-input" placeholder="Describe what you're looking for..." autofocus>
            <button type="submit" class="search-btn">Search</button>
        </form>
    </div>
    {% endif %}

    {% if image_paths is defined and image_paths %}
    <gallery>
        {% for path, name in image_paths %}
        <div class="gallery-item">
            <img src="/images/{{ name }}" alt="{{ path }}">
            <div class="caption">{{ path }}</div>
        </div>
        {% endfor %}
    </gallery>
    {% elif image_paths is defined and not image_paths %}
    <p style="text-align:center; padding:40px; color:#666;">No results found for "{{ search_query }}"</p>
    {% endif %}
</body>
</html>
