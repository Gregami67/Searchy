<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Search</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a1a; color: #e0e0e0; min-height: 100vh; }
        .search-container { display: flex; justify-content: center; padding: 60px 20px 40px; }
        .search-form { display: flex; gap: 8px; width: 100%; max-width: 500px; }
        .search-input { flex: 1; padding: 12px 16px; border: none; border-radius: 8px; font-size: 16px; background: #2a2a2a; color: #e0e0e0; outline: none; }
        .search-input:focus { box-shadow: 0 0 0 2px #4a9eff; }
        .search-input::placeholder { color: #666; }
        .search-btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; background: #4a9eff; color: white; cursor: pointer; transition: background 0.2s; }
        .search-btn:hover { background: #3a8eef; }
        .search-btn:disabled { opacity: 0.5; cursor: wait; }
        .gallery { padding: 20px; column-count: 5; column-gap: 16px; max-width: 1400px; margin: 0 auto; }
        .gallery-item { break-inside: avoid; margin-bottom: 16px; }
        .gallery-item img { width: 100%; display: block; cursor: zoom-in; }
        .gallery-item:hover { opacity: 0.9; }
        #viewer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; display: none; cursor: zoom-in; justify-content: center; align-items: center; }
        #viewer-overlay.active { display: flex; }
        #viewer-img { max-width: 90vw; max-height: 90vh; object-fit: contain; transition: transform 0.15s ease; user-select: none; -webkit-user-drag: none; margin: auto; }
        #loader { text-align: center; padding: 40px; color: #666; font-size: 14px; }
        #results { display: none; }
    </style>
</head>
<body>
    <div class="search-container">
        <form class="search-form" id="searchForm">
            <input type="text" name="q" id="searchInput" class="search-input" placeholder="Describe what you're looking for..." autofocus>
            <button type="submit" class="search-btn" id="searchBtn">Search</button>
        </form>
    </div>

    <div id="results"></div>
    <div id="loader" style="display:none;">Loading...</div>

    <div id="viewer-overlay">
        <img id="viewer-img" src="" alt="">
    </div>

    <script>
        const resultsEl = document.getElementById('results');
        const loader = document.getElementById('loader');
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        let currentQuery = '';
        let currentPage = 1;
        let hasMore = false;
        let isLoading = false;

        function showEmptyMessage(query) {
            resultsEl.style.display = 'block';
            resultsEl.innerHTML = '<p style="text-align:center; padding:40px; color:#666;">No results found for "' + query + '"</p>';
            hasMore = false;
        }

        function appendGallery(results) {
            resultsEl.style.display = 'block';
            if (results.image_paths.length === 0) {
                hasMore = false;
                return;
            }

            let html = '';
            for (const name of results.image_paths) {
                html += '<div class="gallery-item">'
                    + '<img src="/images/' + encodeURIComponent(name) + '" alt="' + name + '">'
                    + '</div>';
            }

            if (!resultsEl.querySelector('.gallery')) {
                resultsEl.innerHTML = '<div class="gallery"></div>';
            }
            const gallery = resultsEl.querySelector('.gallery');
            gallery.insertAdjacentHTML('beforeend', html);
            hasMore = results.has_next;
        }

        async function doSearch(query, page) {
            input.value = query;
            currentQuery = query;
            currentPage = page;

            const btn = document.getElementById('searchBtn');
            btn.disabled = true;
            btn.textContent = 'Searching...';

            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({q: query, page: page})
                });
                const data = await res.json();
                if (page === 1) {
                    hasMore = data.has_next;
                    if (!hasMore && data.total <= 0) {
                        showEmptyMessage(data.search_query || query);
                    }
                    appendGallery(data);
                } else {
                    hasMore = false;
                }
            } finally {
                btn.disabled = false;
                btn.textContent = 'Search';
            }
        }

        function showEmptyMessage(query) {
            resultsEl.style.display = 'block';
            resultsEl.innerHTML = '<p style="text-align:center; padding:40px; color:#666;">No results found for "' + query + '"</p>';
            hasMore = false;
        }

        async function loadMore() {
            if (isLoading || !hasMore) return;
            isLoading = true;
            loader.style.display = 'block';

            currentPage++;
            try {
                const res = await fetch('/api/search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({q: currentQuery, page: currentPage})
                });
                const data = await res.json();
                appendGallery(data);
            } finally {
                isLoading = false;
                if (!hasMore) loader.style.display = 'none';
            }
        }

        // Infinite scroll using IntersectionObserver
        let sentinel = document.createElement('div');
        sentinel.id = 'scroll-sentinel';
        sentinel.style.height = '1px';
        document.body.appendChild(sentinel);

        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && hasMore) {
                loadMore();
            }
        }, { rootMargin: '400px' });
        observer.observe(sentinel);

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = input.value.trim();
            if (!q) return;
            currentPage = 1;
            hasMore = true;
            resultsEl.innerHTML = '<div class="gallery"></div>';
            doSearch(q, 1);
        });

        let debounceTimer;
        input.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            const q = input.value.trim();
            if (!q) return;
            debounceTimer = setTimeout(() => {
                currentPage = 1;
                hasMore = true;
                resultsEl.innerHTML = '<div class="gallery"></div>';
                doSearch(q, 1);
            }, 500);
        });

        // Image viewer with zoom
        const overlay = document.getElementById('viewer-overlay');
        const viewerImg = document.getElementById('viewer-img');
        let viewerZoom = 1;
        let isDragging = false;
        let dragStartX, dragStartY, translateX = 0, translateY = 0;

        function openViewer(src) {
            viewerImg.src = src;
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            viewerZoom = 1;
            translateX = 0;
            translateY = 0;
            updateViewerTransform();
        }

        function closeViewer() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
            viewerZoom = 1;
            translateX = 0;
            translateY = 0;
            updateViewerTransform();
        }

        function updateViewerTransform() {
            viewerImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${viewerZoom})`;
        }

        document.addEventListener('click', (e) => {
            // Open viewer on gallery image click
            if (e.target.closest('.gallery-item img')) {
                const src = e.target.src;
                openViewer(src);
                return;
            }
            // Close viewer when clicking overlay background (not image)
            if (e.target === overlay) {
                if (viewerZoom > 1) {
                    viewerZoom = 1;
                    translateX = 0;
                    translateY = 0;
                    updateViewerTransform();
                } else {
                    closeViewer();
                }
            }
        });

        document.addEventListener('wheel', (e) => {
            if (!overlay.classList.contains('active')) return;
            e.preventDefault();
            viewerZoom += e.deltaY < 0 ? 0.15 : -0.15;
            viewerZoom = Math.max(0.3, Math.min(viewerZoom, 10));
            updateViewerTransform();
        }, { passive: false });

        document.addEventListener('mousedown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (viewerZoom > 1 && e.target === viewerImg) {
                isDragging = true;
                dragStartX = e.clientX - translateX;
                dragStartY = e.clientY - translateY;
                overlay.style.cursor = 'grabbing';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - dragStartX;
            translateY = e.clientY - dragStartY;
            updateViewerTransform();
        });

        document.addEventListener('mouseup', () => {
            isDragging = false;
            overlay.style.cursor = 'zoom-in';
        });

        document.addEventListener('keydown', (e) => {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') closeViewer();
        });
    </script>
</body>
</html>
